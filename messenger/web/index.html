<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Auth pages -->
        <div id="auth-page" class="auth-page">
            <!-- Login form -->
            <div id="login-form" class="auth-card">
                <h1 class="auth-title">Вход в Messenger</h1>
                <p class="auth-subtitle">Добро пожаловать обратно!</p>
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div>
                        <label for="login-username">Имя пользователя</label>
                        <input type="text" id="login-username" name="username" required placeholder="Введите имя пользователя">
                        <div class="error-message" id="login-username-error"></div>
                    </div>
                    <div>
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" name="password" required placeholder="Введите пароль">
                        <div class="error-message" id="login-password-error"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="login-btn">
                        <span class="btn-text">Войти</span>
                    </button>
                </form>
                <p class="auth-form-footer">
                    Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a>
                </p>
            </div>

            <!-- Register form -->
            <div id="register-form" class="auth-card hidden">
                <h1 class="auth-title">Регистрация</h1>
                <p class="auth-subtitle">Создайте новый аккаунт</p>
                <form class="auth-form" onsubmit="handleRegister(event)">
                    <div>
                        <label for="register-username">Имя пользователя</label>
                        <input type="text" id="register-username" name="username" required placeholder="Придумайте имя пользователя">
                        <div class="error-message" id="register-username-error"></div>
                    </div>
                    <div>
                        <label for="register-password">Пароль</label>
                        <input type="password" id="register-password" name="password" required placeholder="Минимум 8 символов">
                        <div class="error-message" id="register-password-error"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="register-btn">
                        <span class="btn-text">Зарегистрироваться</span>
                    </button>
                </form>
                <p class="auth-form-footer">
                    Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a>
                </p>
            </div>
        </div>

        <!-- Main chat interface -->
        <div id="main-page" class="main-page hidden">
            <header class="header">
                <h1>Messenger</h1>
                <div class="header-actions">
                    <div class="status-badge" id="status-badge">
                        <div class="status-dot" id="status-dot"></div>
                        <span id="status-text">Отключено</span>
                    </div>
                    <button class="btn btn-secondary" onclick="openCreateChatModal()">+ Новый чат</button>
                    <button class="btn btn-danger" onclick="handleLogout()">Выйти</button>
                </div>
            </header>

            <div class="main-content">
                <div class="chat-list" id="chat-list">
                    <!-- Chat items will be rendered here -->
                </div>

                <div class="chat-area" id="chat-area">
                    <div class="empty-state" id="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-title">Выберите чат</div>
                        <div class="empty-state-text">Нажмите "+ Новый чат" для начала общения</div>
                    </div>

                    <div class="chat-container hidden" id="chat-container">
                        <div class="chat-header" id="chat-header">Выберите чат</div>
                        <div class="messages" id="messages"></div>
                        <div class="input-area">
                            <textarea id="message-input" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)"></textarea>
                            <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Create chat modal -->
    <div class="modal-overlay" id="create-chat-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Новый чат</h2>
                <button class="modal-close" onclick="closeCreateChatModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div>
                    <label for="chat-participant-username">Имя пользователя для чата</label>
                    <input type="text" id="chat-participant-username" placeholder="Введите имя пользователя">
                    <div class="error-message" id="chat-participant-error"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCreateChatModal()">Отмена</button>
                <button class="btn btn-primary" onclick="createChat()">Создать чат</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
